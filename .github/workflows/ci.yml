name: InvoicePro CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check for forbidden files
        shell: bash
        run: |
          test ! -e .env
          test ! -e .env.local
          test ! -d .vercel

      - name: Scan tracked files for credential patterns
        shell: bash
        run: |
          if git grep -n -I -E 'service_role|SUPABASE_SERVICE_ROLE_KEY|postgresql://postgres|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY-----'; then
            echo 'Forbidden credential pattern detected in tracked files.'
            exit 1
          fi
